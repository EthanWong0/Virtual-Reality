<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
    <a-box wireframe = "true" class = "car body">
      <a-box position="0.125 1.5 0" rotation="0 0 0" width = "4.5"  depth = "1.75" height = "1.25" src = "truck_texture.webp"></a-box>
      <a-box position="-2.2 1.4 0" rotation="0 0 0" width = "2"  depth = "1.75" height = "1.15" src = "truck_texture.webp"></a-box>
      <a-box position="-2.2 2 0.75" rotation="0 0 0" width = "2"  depth = ".25" height = ".35" src = "truck_texture.webp"></a-box>
      <a-box position="-2.2 2 -0.75" rotation="0 0 0" width = "2"  depth = ".25" height = ".35" src = "truck_texture.webp"></a-box>
      <a-box position="-0.5 2.5 0" rotation="0 0 0" width = "3.25"  depth = "1.75" height = "1" src = "truck_texture.webp"></a-box>
      <a-box position="-3.075 2 0" rotation="0 90 0" width = "1.6"  depth = ".25" height = ".35" src = "truck_texture.webp"></a-box>
      <a-box position="-1.25 2.5 0.15" rotation="0 0 0" width = "1.25"  depth = "1.5" height = ".75" src = "glass_window.jpg"></a-box>
      <a-box position=".25 2.5 0.15" rotation="0 0 0" width = "1.25"  depth = "1.5" height = ".75" src = "glass_window.jpg"></a-box>
      <a-box position="-1.25 2.5 -0.18" rotation="0 0 0" width = "1.25"  depth = "1.5" height = ".75" src = "glass_window.jpg"></a-box>
      <a-box position=".25 2.5 -0.18" rotation="0 0 0" width = "1.25"  depth = "1.5" height = ".75" src = "glass_window.jpg"></a-box>
      <a-box position="1.2 2.2 0" rotation="0 0 -45" width = "1.2"  depth = "1.75" height = "1" src = "truck_texture.webp"></a-box>
      <a-box position="1.4 2.2 0" rotation="0 0 -45" width = "1.2"  depth = "1.65" height = ".8" src = "glass_window.jpg"></a-box>
      <a-cylinder position="0.5 1.7 .95" rotation="0 0 90" radius = "0.05" height = ".4" color="white"></a-cylinder>
      <a-cylinder position="0.5 1.7 -.95" rotation="0 0 90" radius = "0.05" height = ".4" color="white"></a-cylinder>
      
      <a-box wireframe = "true" class ="wheels">
        <a-torus src = "tire.jpg" position="-2.25 1 -0.9"  rotation="0 0 0" height=".2"  radius="0.25"></a-torus>
        <a-cylinder position="-2.25 1 -0.9" src = "metal_texture.jpg" rotation="90 0 0" height=".8"  radius="0.25"></a-cylinder>
        <a-torus src = "tire.jpg" position="-2.25 1 1"  rotation="0 0 0" height=".2"  radius="0.25"></a-torus>
        <a-cylinder position="-2.25 1 1" src = "metal_texture.jpg" rotation="90 0 0" height=".8"  radius="0.25"></a-cylinder>
        <a-torus src = "tire.jpg" position="1.6 1 1"  rotation="0 0 0" height=".2"  radius="0.25"></a-torus>
        <a-cylinder position="1.6 1 1" src = "metal_texture.jpg" rotation="90 0 0" height=".8"  radius="0.25"></a-cylinder>
         <a-torus src = "tire.jpg" position="1.6 1 -.9"  rotation="0 0 0" height=".2"  radius="0.25"></a-torus>
        <a-cylinder position="1.6 1 -.9" src = "metal_texture.jpg" rotation="90 0 0" height=".8"  radius="0.25"></a-cylinder>
      </a-box>
      
      <a-box wireframe = "true" class ="carmisc">
        <a-box position="-5.075 2 0" rotation="0 90 0" width = ".4"  depth = ".1" height = ".15" src = "plate_texture.jpg"></a-box>
        <a-box position="3.075 2 0" rotation="0 90 0" width = ".9"  depth = ".1" height = ".25" src = "CarFrontGrate.jpg"></a-box>
        <a-cylinder position="3 1 -.9" src = "Headlight.jpg" rotation="90 90 0" height=".1"  radius="0.15"></a-cylinder>
        <a-cylinder position="3 1 -.9" src = "Headlight.jpg" rotation="90 90 0" height=".1"  radius="0.15"></a-cylinder>
      </a-box>
    </a-box>
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
